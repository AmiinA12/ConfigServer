server:
  port: 5000

spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        - id: CAPTEURS-SERVICE
          uri: lb://CAPTEURS-SERVICE
          predicates:
            - Path=/capteurs/**
          filters:
            - RewritePath=/capteurs/(?<segment>.*), /api/${segment}

        - id: IRRIGATION-SERVICE
          uri: lb://IRRIGATION-SERVICE
          predicates:
            - Path=/irrigation/**
          filters:
            - RewritePath=/irrigation/(?<segment>.*), /api/${segment}

# =========================
# EUREKA
# =========================
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:4040/eureka

# =========================
# MANAGEMENT
# =========================
management:
  endpoints:
    web:
      exposure:
        include: gateway
  endpoint:
    gateway:
      access: read-only
